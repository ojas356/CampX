version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campx_db}
      POSTGRES_USER: ${DB_USERNAME:-campx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campx_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Lightweight resource constraints for student laptops
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
    driver: local
