spring.application.name=campx-backend
server.port=${SERVER_PORT:8080}

# Database Configuration with Environment Variables and local defaults
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campx_db}
spring.datasource.username=${DB_USERNAME:campx_user}
spring.datasource.password=${DB_PASSWORD:campx_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
campx.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
campx.jwt.expiration-ms=86400000

# File Upload Settings for local product images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
campx.upload.dir=uploads
